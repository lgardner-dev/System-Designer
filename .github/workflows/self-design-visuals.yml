name: Correct self-design presentation
on:
  push:
    branches: [work/self-design-visual-prep]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact bounded presentation correction
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib
          raw = base64.b64decode(pathlib.Path('.self-design-visuals.b64').read_text(), validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'c092aea471170c8b893b18ddc8225fdb63e3a2c15ebc4da819497ffd3473160d'
          exec(compile(lzma.decompress(raw), 'self-design-presentation-correction', 'exec'))
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and publish workbench
        run: |
          cargo fmt --all
          git config user.name 'System Designer presentation correction'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/self-design-atlas/view.rs docs/self-design/MODEL.md
          git commit -m 'Keep bypasses clear and primitive boundary arrows truthful'
          git push origin HEAD:refs/heads/work/self-design-visual-corrected
