name: Native build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Verify branding asset integrity
        run: python packaging/verify-branding.py
      - name: Verify every display asset against the selected master
        if: runner.os == 'Linux'
        run: |
          python -m pip install Pillow==12.3.0
          python packaging/generate-branding.py --check
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Warning-free compiler, Clippy, docs, tests and native builds
        run: python tools/verify.py --log-dir target/qualification
      - name: Preserve complete qualification logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qualification-${{ matrix.os }}
          path: target/qualification/
          if-no-files-found: error
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bin = (Resolve-Path target/release/system-designer.exe).Path
          $out = Join-Path $pwd 'dist/system-designer-setup.exe'
          $version = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          $numeric = ($version -split '[-+]')[0]
          $parts = @($numeric -split '\.') + @('0','0','0','0')
          $version4 = ($parts[0..3]) -join '.'
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DAPP_VERSION=$version" "/DAPP_VERSION_4=$version4" "/DAPP_BINARY=$bin" "/DOUT_FILE=$out" packaging/windows/setup.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          python packaging/verify-branding.py --pe target/release/system-designer.exe --installer dist/system-designer-setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Icon resource verification failed' }
          Copy-Item Cargo.lock dist/
      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/make-installer.sh
          cp Cargo.lock dist/
      # Prove the installer actually installs, rather than only that it built.
      - name: Verify Linux installer round trip
        if: runner.os == 'Linux'
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/sd-data"
          icon_root="$XDG_DATA_HOME/icons/hicolor"
          mkdir -p "$icon_root/32x32/apps"
          printf 'unrelated' > "$icon_root/32x32/apps/other-app.png"
          bash dist/system-designer-setup.sh --prefix "$RUNNER_TEMP/sd" --no-desktop-icon
          test -x "$RUNNER_TEMP/sd/bin/system-designer"
          for size in 16 24 32 48 64 128 256 512; do
            cmp "assets/branding/linux/png/system-designer-$size.png" "$icon_root/${size}x${size}/apps/system-designer.png"
          done
          cmp assets/branding/linux/scalable/system-designer.svg "$icon_root/scalable/apps/system-designer.svg"
          grep -qx 'Icon=system-designer' "$XDG_DATA_HOME/applications/system-designer.desktop"
          bash dist/system-designer-setup.sh --prefix "$RUNNER_TEMP/sd" --uninstall
          test ! -e "$RUNNER_TEMP/sd/bin/system-designer"
          test -z "$(find "$icon_root" -type f -name 'system-designer.*' -print)"
          test -f "$icon_root/32x32/apps/other-app.png"
      - name: Package macOS application bundle
        if: runner.os == 'macOS'
        run: |
          mkdir -p 'dist/System Designer.app/Contents/MacOS' 'dist/System Designer.app/Contents/Resources'
          cp assets/branding/macos/system-designer.icns 'dist/System Designer.app/Contents/Resources/system-designer.icns'
          cp target/release/system-designer 'dist/System Designer.app/Contents/MacOS/SystemDesigner'
          cat > 'dist/System Designer.app/Contents/Info.plist' <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>System Designer</string>
          <key>CFBundleIdentifier</key><string>org.systemdesigner.desktop</string>
          <key>CFBundleExecutable</key><string>SystemDesigner</string>
          <key>CFBundleIconFile</key><string>system-designer.icns</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.2.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          cmp assets/branding/macos/system-designer.icns 'dist/System Designer.app/Contents/Resources/system-designer.icns'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' 'dist/System Designer.app/Contents/Info.plist' | grep -qx 'system-designer.icns'
          hdiutil create -volname 'System Designer' -srcfolder 'dist/System Designer.app' -ov -format UDZO dist/SystemDesigner-macOS.dmg
          cp Cargo.lock dist/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SystemDesigner-${{ matrix.os }}
          path: |
            dist/
            Cargo.lock
          if-no-files-found: error
