name: Control-flow worked candidate
on:
  pull_request:
    paths:
      - 'examples/s2-flow-candidate/**'
      - 'docs/control-flow-study/**'
      - '.github/workflows/control-flow-study.yml'
      - 'Cargo.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux development and smoke-test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb openbox xdotool
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Production and study regression tests
        run: cargo test --locked --all-targets
      - name: Headless production compatibility
        run: cargo test --locked --no-default-features
      - name: Clippy findings
        run: cargo clippy --locked --example s2-flow-candidate
      - name: Compile native worked candidate
        run: cargo build --locked --release --example s2-flow-candidate
      - name: Verify fixture with the compiled candidate
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            target/release/examples/s2-flow-candidate.exe --check
          else
            target/release/examples/s2-flow-candidate --check
          fi
      - name: Stage portable candidate and reference files
        shell: bash
        run: |
          mkdir -p study-dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/examples/s2-flow-candidate.exe study-dist/
          else
            cp target/release/examples/s2-flow-candidate study-dist/
          fi
          cp examples/s2-flow-candidate/{interfaces.project.json,control-flow.study.json,source-S2.json,initialization.txt} study-dist/
          cp docs/control-flow-study/{README.md,DESIGN.md,SOURCE-MAP.md} study-dist/
          git rev-parse HEAD > study-dist/COMMIT.txt
          git archive --format=zip HEAD -o study-dist/source.zip
      - name: Native Linux screenshot smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 WINIT_UNIX_BACKEND=x11
          Xvfb :99 -screen 0 1920x1200x24 >study-dist/xvfb.log 2>&1 &
          XVFB=$!
          sleep 2
          openbox >study-dist/openbox.log 2>&1 &
          WM=$!
          target/release/examples/s2-flow-candidate --capture study-dist/screenshots >study-dist/native.log 2>&1 &
          APP=$!
          trap 'kill $APP $WM $XVFB 2>/dev/null || true' EXIT
          # Mapping is an explicit environment accommodation, not evidence of
          # unassisted desktop startup on a physical machine.
          for i in $(seq 1 20); do
            W=$(xdotool search --pid "$APP" --name 'System Designer' 2>/dev/null | head -1 || true)
            if [ -n "$W" ]; then xdotool windowmap "$W"; xdotool windowactivate --sync "$W" || true; break; fi
            sleep 1
          done
          for i in $(seq 1 50); do
            if ! kill -0 "$APP" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$APP" 2>/dev/null; then echo 'Native capture timed out'; exit 1; fi
          wait "$APP"
          test "$(find study-dist/screenshots -name '*.ppm' | wc -l)" -eq 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S2-Control-Flow-Study-${{ matrix.os }}
          path: study-dist/
          if-no-files-found: warn
