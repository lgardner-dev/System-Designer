name: Prepare owner-supplied icon integration
on:
  push:
    branches: [work/iconography-prep]
permissions:
  contents: write
concurrency:
  group: owner-iconography-import
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'lgardner-dev/System-Designer' && github.ref == 'refs/heads/work/iconography-prep'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/iconography-prep
      - name: Extract exact approved bytes and apply bounded integration
        run: python .github/import-icons.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Resolve only newly needed lockfile entries and check headless build
        run: cargo check --no-default-features
      - name: Format Rust changes and verify asset integrity
        run: |
          cargo fmt --all
          python packaging/verify-branding.py
          bash -n packaging/linux/installer-header.sh packaging/linux/make-installer.sh packaging/linux/install.sh
      - name: Preserve proposed CI change for authorized connector publication
        run: cp .github/workflows/ci.yml /tmp/iconography-ci.yml
      - uses: actions/upload-artifact@v4
        with:
          name: iconography-ci-proposal
          path: /tmp/iconography-ci.yml
          if-no-files-found: error
      - name: Publish assets and code only to the temporary work branch
        run: |
          set -euo pipefail
          git restore .github/workflows
          git add -A
          git diff --cached --stat
          git -c user.name='System Designer automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Prepare approved artwork and native platform resources'
          git push origin HEAD:refs/heads/work/iconography-prep
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
