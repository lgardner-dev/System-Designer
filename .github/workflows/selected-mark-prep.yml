name: Prepare selected color-mark correction
on:
  push:
    branches: [work/selected-mark-prep]
    paths: [.github/workflows/selected-mark-prep.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate the clean asset correction without changing workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/work/iconography)" = "6ddc31c3bda0365a07263309118df1f3c21f31ab"
          python - <<'PY'
          from pathlib import Path
          import os, subprocess, textwrap
          prior = subprocess.check_output(['git', 'show', 'ec8df38fc0d82aa4ff183432bb74fa417f70bb98:.github/workflows/selected-mark-prep.yml'], text=True)
          code = prior.split("          python - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0]
          Path(os.environ['RUNNER_TEMP'], 'apply-selected.py').write_text(textwrap.dedent(code), encoding='utf-8')
          PY
          git checkout --detach 6ddc31c3bda0365a07263309118df1f3c21f31ab
          python -m pip install Pillow==12.3.0
          python "$RUNNER_TEMP/apply-selected.py"
          # GITHUB_TOKEN may publish assets, not changed workflow definitions.
          # The authorized GitHub connector will apply the CI change separately.
          git restore .github/workflows/ci.yml
          python packaging/verify-branding.py
          python packaging/generate-branding.py --check
          cargo fmt --all --check
          git add assets/branding README.md docs/BRANDING.md src/ui/branding.rs packaging/generate-branding.py packaging/verify-branding.py
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Derive all displayed icons from the owner-selected color mark'
          git push origin HEAD:refs/heads/work/selected-mark-candidate
          git rev-parse HEAD > "$RUNNER_TEMP/candidate.txt"
          git archive --format=zip HEAD > "$RUNNER_TEMP/selected-mark-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: selected-mark-candidate-source
          path: |
            ${{ runner.temp }}/candidate.txt
            ${{ runner.temp }}/selected-mark-source.zip
          if-no-files-found: error
