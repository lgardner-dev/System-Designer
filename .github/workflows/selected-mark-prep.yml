name: Prepare selected color-mark correction
on:
  push:
    branches: [work/selected-mark-prep]
    paths: [.github/workflows/selected-mark-prep.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build a clean candidate from the exact prior PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/work/iconography)" = "6ddc31c3bda0365a07263309118df1f3c21f31ab"
          git checkout --detach 6ddc31c3bda0365a07263309118df1f3c21f31ab
          python -m pip install Pillow==12.3.0
          python - <<'PY'
          from pathlib import Path
          import subprocess


          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              assert text.count(old) == 1, f"unexpected replacement count in {path}: {old!r}"
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          Path("packaging/generate-branding.py").write_text('#!/usr/bin/env python3\n"""Generate/check display assets from the owner\'s exact selected SVG.\n\nMaintenance/CI only: python -m pip install Pillow==12.3.0\nOrdinary application builds use the checked-in outputs and need no Pillow.\n"""\nfrom __future__ import annotations\n\nimport argparse\nimport base64\nimport hashlib\nimport io\nimport json\nfrom pathlib import Path\nimport xml.etree.ElementTree as ET\n\nimport PIL\nfrom PIL import Image\n\nROOT = Path(__file__).resolve().parents[1]\nBRAND = ROOT / "assets/branding"\nMASTER = "svg/system-designer-atom-mark-color.svg"\n# Changing the chosen artwork is an explicit owner decision, not a checksum refresh.\nMASTER_SHA256 = "52c1a21a91c8769b0f67c9c97c02e0af77fa75f07b20064aa295feb44772a3ad"\nPILLOW_VERSION = "12.3.0"\n\n\ndef require(condition: bool, message: str) -> None:\n    if not condition:\n        raise ValueError(message)\n\n\ndef digest(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\n\ndef outputs() -> dict[str, bytes]:\n    require(PIL.__version__ == PILLOW_VERSION,\n            f"Use Pillow=={PILLOW_VERSION} for the recorded resampling recipe")\n    svg = (BRAND / MASTER).read_bytes()\n    require(digest(svg) == MASTER_SHA256, "Selected master changed; obtain owner approval")\n    # This exact SVG contains one embedded PNG, with no transforms or extra drawing.\n    # Decode it losslessly rather than screenshotting, tracing, or inventing artwork.\n    element = ET.fromstring(svg)\n    require(len(element) == 1 and element[0].tag == "{http://www.w3.org/2000/svg}image",\n            "Unsupported master SVG structure")\n    href = element[0].get("href", "")\n    require(href.startswith("data:image/png;base64,"), "Master must embed its PNG")\n    png = base64.b64decode(href.partition(",")[2], validate=True)\n    with Image.open(io.BytesIO(png)) as opened:\n        master = opened.convert("RGBA")\n    require(master.size == (1254, 1254), "Unexpected selected-master dimensions")\n    master.info.clear()\n    sizes = (16, 24, 32, 48, 64, 128, 180, 192, 256, 512, 1024)\n    images = {s: master.resize((s, s), Image.Resampling.LANCZOS) for s in sizes}\n    pngs = {}\n    for size, image in images.items():\n        stream = io.BytesIO()\n        image.save(stream, format="PNG")\n        pngs[size] = stream.getvalue()\n\n    result = {f"linux/png/system-designer-{s}.png": pngs[s]\n              for s in (16, 24, 32, 48, 64, 128, 256, 512)}\n    result.update({f"windows/system-designer-{s}.png": pngs[s]\n                   for s in (16, 32, 48, 256)})\n    for size in (16, 32, 128, 256, 512):\n        for scale in (1, 2):\n            suffix = "@2x" if scale == 2 else ""\n            result[f"macos/system-designer.iconset/icon_{size}x{size}{suffix}.png"] = pngs[size * scale]\n    for name in ("linux/scalable/system-designer.svg", "web/favicon.svg", "web/logo-mark.svg"):\n        result[name] = svg\n    for name in ("branding/system-designer-atom-mark-color.png", "web/logo-mark.png"):\n        result[name] = png\n    result.update({"web/apple-touch-icon.png": pngs[180], "web/icon-192.png": pngs[192],\n                   "web/icon-512.png": pngs[512]})\n    for name, icon_sizes in (("windows/system-designer.ico", (16, 24, 32, 48, 64, 128, 256)),\n                             ("web/favicon.ico", (16, 32, 48))):\n        stream = io.BytesIO()\n        images[max(icon_sizes)].save(stream, format="ICO", sizes=[(s, s) for s in icon_sizes],\n                                    append_images=[images[s] for s in icon_sizes])\n        result[name] = stream.getvalue()\n    stream = io.BytesIO()\n    images[1024].save(stream, format="ICNS",\n                      append_images=[images[s] for s in (32, 64, 128, 256, 512, 1024)])\n    result["macos/system-designer.icns"] = stream.getvalue()\n    return result\n\n\ndef pixels(image: Image.Image) -> tuple[tuple[int, int], bytes]:\n    return image.size, image.convert("RGBA").tobytes()\n\n\ndef signature(name: str, data: bytes) -> object:\n    """Compare every decoded frame, independent of PNG/zlib encoding differences."""\n    if name.endswith(".svg"):\n        return data  # SVG copies must preserve the source byte for byte.\n    with Image.open(io.BytesIO(data)) as image:\n        if name.endswith(".ico"):\n            return {size: pixels(image.ico.getimage(size)) for size in image.ico.sizes()}\n        if name.endswith(".icns"):\n            frames = {}\n            for width, height, scale in image.info["sizes"]:\n                with Image.open(io.BytesIO(data)) as frame:\n                    frame.size = (width, height)\n                    frame.load(scale=scale)\n                    frames[(width, height, scale)] = pixels(frame)\n            return frames\n        return pixels(image)\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument("--check", action="store_true", help="Check without changing any files")\n    args = parser.parse_args()\n    expected = outputs()\n    manifest_path = BRAND / "manifest.json"\n    manifest = json.loads(manifest_path.read_text(encoding="utf-8"))\n    selection = {"path": MASTER, "sha256": MASTER_SHA256,\n                 "recipe": f"embedded PNG; direct RGBA LANCZOS resizing; Pillow {PILLOW_VERSION}"}\n    if args.check:\n        require(manifest.get("selected_master") == selection, "Selection metadata is stale")\n        require(manifest.get("derived_files") == sorted(expected), "Derived-file inventory is stale")\n        for name, data in expected.items():\n            actual = (BRAND / name).read_bytes()\n            require(signature(name, actual) == signature(name, data),\n                    f"Not derived from the selected color mark: {name}")\n        print(f"Verified all frames/pixels in {len(expected)} outputs against {MASTER}")\n        return\n    # Preserve the exact source archive\'s provenance; current files are not all originals.\n    manifest.setdefault("original_import_commit", "6ddc31c3bda0365a07263309118df1f3c21f31ab")\n    manifest["selected_master"] = selection\n    manifest["derived_files"] = sorted(expected)\n    actual_files = {p.relative_to(BRAND).as_posix() for p in BRAND.rglob("*")\n                    if p.is_file() and p.name != "manifest.json"}\n    require(actual_files == set(manifest["files"]), "Unexpected branding files; inspect inventory first")\n    require(set(expected) <= actual_files, "Expected display-asset path is missing")\n    for name, data in expected.items():\n        (BRAND / name).write_bytes(data)\n    manifest["files"] = {name: digest((BRAND / name).read_bytes()) for name in sorted(actual_files)}\n    manifest_path.write_text(json.dumps(manifest, indent=2) + "\\n", encoding="utf-8", newline="\\n")\n    print(f"Generated {len(expected)} display assets from {MASTER}; source unchanged")\n\n\nif __name__ == "__main__":\n    main()\n', encoding="utf-8", newline="\n")
          Path("docs/BRANDING.md").write_text("# System Designer iconography\n\n## One selected master\n\nAll displayed product icons derive from the owner's selected file:\n\n`assets/branding/svg/system-designer-atom-mark-color.svg`\n\nSHA-256: `52c1a21a91c8769b0f67c9c97c02e0af77fa75f07b20064aa295feb44772a3ad`\n\nThis is the cyan-and-silver interwoven mark, not the other icon/tile in the\noriginal package. The SVG is preserved byte for byte. It wraps one 1254x1254\nRGBA PNG; it is not a newly traced vector. Extraction preserves the embedded\nimage exactly. Smaller outputs are resized directly from that image using\nLanczos, with its original transparent canvas and colors: no crop, added tile,\nrecoloring, or redrawing.\n\nThe initial platform exports in the supplied ZIP used a different design.\nThey have been replaced with derivatives of this selected master. The initial\n42-file import remains available at commit\n`6ddc31c3bda0365a07263309118df1f3c21f31ab`; the original ZIP remains in upload\ncommit `b03fd1e0b1315868f901348931124488ed065cde`.\n`assets/branding/manifest.json` distinguishes original archive provenance,\ncurrent file checksums, the selected master, and the 33 derived display assets.\nUnselected original artwork under `svg/`, `sources/`, and `branding/` is retained\nonly as historical reference; it is not an alternative input for app packaging.\nThe repository license is unchanged.\n\n## Regeneration and verification\n\nOrdinary Rust builds consume the checked-in assets. They need no Python imaging\nlibrary, renderer, network service, or runtime icon sidecar.\nFor artwork maintenance only:\n\n```sh\npython -m pip install Pillow==12.3.0\npython packaging/generate-branding.py\npython packaging/verify-branding.py\npython packaging/generate-branding.py --check\n```\n\nThe generator reads only the selected SVG, never the platform folders or an\nindependently selected PNG. It writes all Linux, Windows, macOS and web outputs,\nincluding the full-size README/logo PNG. `--check` writes nothing: it regenerates\nin memory and compares every PNG's RGBA pixels and every ICO/ICNS frame, plus\nbyte-exact SVG copies. PNG compression differences do not change that result.\nThe source checksum is pinned in the generator; changing the chosen master\nrequires an explicit owner decision rather than silently refreshing a manifest.\n\nThe dependency-free `verify-branding.py` checks the current inventory, hashes,\nPNG dimensions, ICO/ICNS structure and selection binding. Its optional\n`--pe target/release/system-designer.exe` check inspects the linked PE resource\nhierarchy and every selected ICO frame. `--installer dist/system-designer-setup.exe`\nchecks for a selected installer icon. Normal CI runs integrity checks on all\nplatforms and the Pillow source-to-output check on Linux. Three Rust branding\ntests cover decoding, the selected mark's 256px RGBA fingerprint, and texture reuse.\n\n## Consumers\n\n- Native app: `src/ui/branding.rs` embeds the generated 256px Linux PNG for the\n  window, toolbar and Help. Decoding happens once, and textures are reused per\n  egui context. The same artwork is used on all three operating systems.\n- Windows: the generated multi-resolution ICO is embedded in the GUI executable\n  and used by NSIS for installer/uninstaller icons. Shortcuts and Installed Apps\n  reference the branded executable. The headless validator is unchanged.\n- Linux: the generated PNG sizes and byte-exact master SVG are installed into\n  the user's XDG hicolor theme. The desktop/application identity is unchanged.\n  Install/uninstall checks preserve unrelated icons and user project data.\n- macOS: the generated ICNS is copied into `Contents/Resources` and referenced by\n  `CFBundleIconFile`; distribute the `.app`/DMG, not a bare executable.\n- Repository/web: README uses the full-size PNG extracted from the selected SVG.\n  Favicons, touch/PWA icons and logo exports use the same selected mark. No\n  website deployment or GitHub account-avatar change is performed.\n\nProject data, initialization prompts, scoped exchange, canvas behavior and\napplication identities are unchanged. The existing self-design's host/controls\nresponsibilities still own branding; no new application subsystem is added.\n\nResource and pixel checks do not establish desktop-shell appearance. Before\nrelease, inspect freshly installed window, launcher, shortcuts/taskbar/menu/Dock\nand Help icons on each target. Existing shell caches can retain an older icon.\nSigning, notarization, merging and release publication remain separate actions.\n", encoding="utf-8", newline="\n")
          Path("assets/branding/README.txt").write_text("System Designer — selected color mark\n\nAuthoritative artwork: svg/system-designer-atom-mark-color.svg\nSHA-256: 52c1a21a91c8769b0f67c9c97c02e0af77fa75f07b20064aa295feb44772a3ad\n\nUse this cyan-and-silver interwoven mark for all product display surfaces.\nThe original package's platform exports depicted another design. The current\nLinux, Windows, macOS and web exports are regenerated from this selected SVG.\nThe SVG contains an embedded PNG; it is not a newly traced vector drawing.\n\nDo not pick platform icons independently. From the repository root, use:\n  python -m pip install Pillow==12.3.0\n  python packaging/generate-branding.py\n  python packaging/verify-branding.py\n  python packaging/generate-branding.py --check\n\nSee docs/BRANDING.md for source selection, generation and verification details.\nThe manifest lists current checksums and derived files separately from the\noriginal archive provenance. Other original art retained in the repository is\nhistorical reference only, not another approved production source.\n", encoding="utf-8", newline="\n")
          replace('README.md', 'assets/branding/branding/system-designer-atom-icon.png', 'assets/branding/branding/system-designer-atom-mark-color.png')
          replace('README.md', 'The approved [icon family](assets/branding/README.txt) is checked in for the\nnative app, installers, documentation and future website. See\n[branding integration](docs/BRANDING.md) for source fidelity and platform details.', 'The selected [color mark](assets/branding/svg/system-designer-atom-mark-color.svg)\nis the single source for the native app, installers, README and web exports. See\n[branding integration](docs/BRANDING.md) for regeneration and pixel-level checks.')
          replace('src/ui/branding.rs', '/// The supplied PNG is compiled in; no file, service or image loader is required.', '/// The PNG derived from the selected color-mark SVG is compiled in; no sidecar is required.')
          replace('src/ui/branding.rs', '    #[test]\n    fn icon_texture_is_cached_per_context()', '    #[test]\n    fn embedded_icon_is_owner_selected_color_mark() {\n        use sha2::{Digest, Sha256};\n        let digest = format!("{:x}", Sha256::digest(window_icon().rgba));\n        assert_eq!(\n            digest,\n            "af97d4bdef6c9207dfbcc8fe7a598071dc825dd05c0c9a124f6650be0708e7a8"\n        );\n    }\n\n    #[test]\n    fn icon_texture_is_cached_per_context()')
          replace('packaging/verify-branding.py', 'Dependency-free checks of original icon bytes and optional Windows PE resources.', 'Dependency-free checks of current branding assets and optional Windows PE resources.')
          replace('packaging/verify-branding.py', '    files = manifest["files"]\n', '    files = manifest["files"]\n    selected = manifest["selected_master"]\n    assert selected["path"] == "svg/system-designer-atom-mark-color.svg"\n    assert files[selected["path"]] == selected["sha256"], "selected-source binding changed"\n    assert set(manifest["derived_files"]) <= set(files), "missing derived assets"\n')
          replace('packaging/verify-branding.py', 'original files, PNG sizes, ICO frames and ICNS structure', 'branding files, selected-source binding, PNG sizes, ICO frames and ICNS structure')
          replace('.github/workflows/ci.yml', '      - name: Verify original branding assets\n        run: python packaging/verify-branding.py\n', "      - name: Verify branding asset integrity\n        run: python packaging/verify-branding.py\n      - name: Verify every display asset against the selected master\n        if: runner.os == 'Linux'\n        run: |\n          python -m pip install Pillow==12.3.0\n          python packaging/generate-branding.py --check\n")
          subprocess.run(["python", "packaging/generate-branding.py"], check=True)
          PY
          python packaging/verify-branding.py
          python packaging/generate-branding.py --check
          cargo fmt --all --check
          git add assets/branding README.md docs/BRANDING.md src/ui/branding.rs packaging/generate-branding.py packaging/verify-branding.py .github/workflows/ci.yml
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows/selected-mark-prep.yml)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Derive all displayed icons from the owner-selected color mark'
          git push origin HEAD:refs/heads/work/selected-mark-candidate
          git rev-parse HEAD > "$RUNNER_TEMP/candidate.txt"
          git archive --format=zip HEAD > "$RUNNER_TEMP/selected-mark-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: selected-mark-candidate-source
          path: |
            ${{ runner.temp }}/candidate.txt
            ${{ runner.temp }}/selected-mark-source.zip
          if-no-files-found: error
