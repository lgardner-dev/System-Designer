# Temporary candidate qualification; remove before final review.
name: Prepare and verify canvas candidate
on:
  push:
    branches: [work/four-sided-ports-and-direction-lights]
permissions:
  contents: read
concurrency:
  group: canvas-candidate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Bind evidence to the exact checked-out commit
        run: |
          mkdir -p visual-check
          git rev-parse HEAD | tee visual-check/COMMIT.txt
      - name: Linux development and visual-check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dev xvfb xdotool imagemagick
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Core and native interaction tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets 2>&1 | tee visual-check/tests.log
      - name: Report Clippy findings
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets 2>&1 | tee visual-check/clippy.log
      - name: Validate embedded design
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --no-default-features --bin designer-check -- design/system-designer.project.json 2>&1 | tee visual-check/self-design.log
      - name: Build native visual candidate
        run: cargo build --locked --bin system-designer
      - name: Prepare explicit four-sided visual fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('tests/fixtures/project.json').read_text())
          contract = p['contracts'][0]
          ref = {'id':contract['id'], 'version':contract['version']}
          p.update(id='project.four-sides-visual', name='Four-sided ports - visual check', purpose='Rendering fixture, not live execution.', root='root', contracts=[contract])
          def port(id, direction):
              return {'id':id, 'name':id.split('.')[-1], 'direction':direction, 'contract':ref}
          hub = {'id':'hub', 'name':'Four-sided component', 'purpose':'Inputs and outputs on every side', 'kind':'component', 'ports':[]}
          nodes, edges, layout = [hub], [], {'hub':{'x':640,'y':510}}
          for name,x,y in [('North',640,70), ('East',1170,510), ('South',640,1000), ('West',110,510)]:
              hub['ports'] += [port('hub.'+name+'-in','in'), port('hub.'+name+'-out','out')]
              nodes.append({'id':name, 'name':name+' peer', 'purpose':'Bidirectional exchange', 'kind':'component', 'ports':[port(name+'.receive','in'),port(name+'.send','out')]})
              edges += [{'id':name+'.to-hub', 'from':{'node':name,'port':name+'.send'}, 'to':{'node':'hub','port':'hub.'+name+'-in'}}, {'id':name+'.from-hub', 'from':{'node':'hub','port':'hub.'+name+'-out'}, 'to':{'node':name,'port':name+'.receive'}}]
              layout[name] = {'x':x,'y':y}
          p['systems'] = [{'id':'root','nodes':nodes,'edges':edges}]
          p['layout'] = {'root':layout}
          Path('visual-check/four-sides.project.json').write_text(json.dumps(p, indent=2))
          PY
      - name: Capture native X11 software-rendered windows
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/designer-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/designer-data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/designer-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1800x1200x24' bash -eu -o pipefail -c '
            capture() {
              target/debug/system-designer "$1" >"visual-check/$2.log" 2>&1 &
              pid=$!
              trap "kill $pid 2>/dev/null || true" EXIT
              for n in $(seq 1 30); do
                wid=$(xdotool search --onlyvisible --name "System Designer" 2>/dev/null | tail -1) || true
                test -n "${wid:-}" && break
                kill -0 "$pid"
                sleep 1
              done
              test -n "${wid:-}"
              xdotool windowfocus "$wid"
              sleep 3
              import -window "$wid" "visual-check/$2.png"
              sleep 1
              import -window "$wid" "visual-check/$2-next.png"
              kill "$pid"
              wait "$pid" || true
              trap - EXIT
            }
            capture visual-check/four-sides.project.json four-sides
            capture design/system-designer.project.json application-design
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-native-visual-check
          path: visual-check/
