name: Format S2 visual corrections
on:
  push:
    branches: [work/s2-study-polish-prep]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply bounded visual repairs
        run: |
          python .s2-repair.py
          cargo fmt --all
          git config user.name 'System Designer source import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/s2-flow-candidate/main.rs examples/s2-flow-candidate/view.rs
          git commit -m 'Correct decision attachment geometry and keep interface cards distinct'
          git push origin HEAD:refs/heads/work/s2-study-polished
