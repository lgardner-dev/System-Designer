name: Polish S2 flowchart spacing
on:
  push:
    branches: [work/control-flow-study]
    paths:
      - '.s2-spacing-polish.py'
      - '.github/workflows/s2-spacing-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and test spacing polish
        run: |
          python .s2-spacing-polish.py
          cargo fmt --all
          cargo test --locked --example s2-flow-candidate
      - name: Publish clean update
        run: |
          rm .s2-spacing-polish.py .github/workflows/s2-spacing-polish.yml
          git config user.name 'System Designer visual refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish terminator spacing and connector labels'
          git push origin HEAD:refs/heads/work/control-flow-study
