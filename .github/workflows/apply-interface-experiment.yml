# One-use source transport. Removed by the verified candidate commit.
name: Apply verified interface experiment
on:
  push:
    branches: [experiment/connection-layout]
    paths: [.github/workflows/apply-interface-experiment.yml, .experiment.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply exact checked source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'experiment/connection-layout'
          echo '9535c9e3afdd5e73ad6f9f6a63a246a433195d85603bc93c83def5223accf4e7  .experiment.patch' | sha256sum --check
          git apply --check .experiment.patch
          git apply .experiment.patch
          rm .experiment.patch .github/workflows/apply-interface-experiment.yml
          git diff --check
      - name: Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Check exact source formatting
        run: cargo fmt --all --check
      - name: Run all target tests
        run: cargo test --locked --all-targets
      - name: Validate embedded self-design
        run: cargo run --locked --no-default-features --bin designer-check -- design/system-designer.project.json
      - name: Commit on the experiment branch only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD" || { echo 'Branch changed; preserving newer work'; exit 1; }
          git add src README.md docs assets design .github/workflows/ci.yml
          git add -u
          git -c user.name='System Designer experiment verification' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement connection-layout from locally verified source'
          git push origin HEAD:"$GITHUB_REF"
          git rev-parse HEAD
