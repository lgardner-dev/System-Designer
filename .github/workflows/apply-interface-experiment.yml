# One-use transport for locally tested patches. Removed by its own candidate commit.
name: Apply verified interface experiment
on:
  push:
    branches: [experiment/focus-trace, experiment/compact-overview, experiment/connection-layout]
    paths: [.github/workflows/apply-interface-experiment.yml, .experiment.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply the exact locally checked source patch
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            experiment/focus-trace) expected=17a18894d19e24cf4f8b7dcfc54fb1fff0714a4c58de21858eba41f59222bb04 ;;
            experiment/compact-overview) expected=02beec3f77e5f1d6887ddd527b15da893df3354885764138ab58b591655aa3ee ;;
            experiment/connection-layout) expected=16390ae7ad907797e0b6154076294f27c0cf9ad71019e91b84c0fce2c1d50ea9 ;;
            *) echo 'Not an authorized experiment branch'; exit 1 ;;
          esac
          echo "$expected  .experiment.patch" | sha256sum --check
          git apply --check .experiment.patch
          git apply .experiment.patch
          rm .experiment.patch .github/workflows/apply-interface-experiment.yml
          if test -f .github/workflows/experiment-tooling.yml; then rm .github/workflows/experiment-tooling.yml; fi
          git diff --check
      - name: Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Check exact source formatting
        run: cargo fmt --all --check
      - name: Run all target tests
        run: cargo test --locked --all-targets
      - name: Validate embedded self-design
        run: cargo run --locked --no-default-features --bin designer-check -- design/system-designer.project.json
      - name: Commit on the experiment branch only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD" || { echo 'Branch changed; preserving newer work'; exit 1; }
          git add src README.md docs assets design .github/workflows/ci.yml
          git add -u
          git -c user.name='System Designer experiment verification' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Implement ${GITHUB_REF_NAME#experiment/} from locally verified source"
          git push origin HEAD:"$GITHUB_REF"
          git rev-parse HEAD
